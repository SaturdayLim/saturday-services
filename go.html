<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Opening app | Saturday Services</title>
<link rel="stylesheet" href="saturday/css/tokens.css">
<link rel="stylesheet" href="saturday/css/saturday.css">
</head>
<body class="sat">
<main class="sat-shell sat-stack" style="padding-block: 96px">
  <p class="sat-lede" id="msg">Opening the app.</p>
  <p><a href="./">Back to all houses</a></p>
</main>
<script>
/* Home-screen shortcut target: go.html?app=<slug>. Opens only apps listed in links.json,
   so this page cannot be used to send people to any other address. */
(function () {
  function slug(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  var want = slug(new URLSearchParams(location.search).get('app'));
  var msg = document.getElementById('msg');
  fetch('links.json').then(function (r) { return r.json(); }).then(function (d) {
    var hit = null;
    (d.links || []).forEach(function (h) {
      (h.options || []).forEach(function (o) { if (!hit && o.link && o.status === 'live' && slug(o.title) === want) hit = o; });
    });
    if (hit) { msg.textContent = 'Opening ' + hit.title + '.'; location.replace(hit.link); }
    else { msg.textContent = 'No app called "' + want + '" in the hub. Pick one from the list.'; }
  }).catch(function () { msg.textContent = 'Unable to load the app list. You may be offline.'; });
})();
</script>
</body>
</html>
